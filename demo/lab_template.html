<title>AAM Corridor Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: research console over a 3D city. Top bar = area + the three papers; left = the selected
   paper's design and experiment controls; right drawer = experiment results with the paper's own values. */
:root {
  --sky: #eef1f3; --ground: #e1e5e8; --bldg: #f8f9fa; --road: #c6ccd2; --road-major: #a8b1b9;
  --panel: #fffffff0; --ink: #16202a; --ink-2: #4b5764; --ink-3: #7c8893; --rule: #dce1e5;
  --accent: #b5267f; --accent-soft: #b5267f1f; --lattice: #b5267f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #c98500; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #1f8a4c; --bad: #d23b3b; --warn: #b7791f;
  --w-lo: #a8d996; --w-mid: #2f9e98; --w-hi: #3346b0;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky: #10161c; --ground: #19212a; --bldg: #8d98a3; --road: #2c3640; --road-major: #3c4854;
  --panel: #151c23f2; --ink: #e7ecf0; --ink-2: #a9b4be; --ink-3: #76828d; --rule: #29333d;
  --accent: #e05aa9; --accent-soft: #e05aa926; --lattice: #e05aa9;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2c9a2c; --s7: #9085e9; --s8: #e66767;
  --good: #44b874; --bad: #ef6a6a; --warn: #d9a441; --w-lo: #4e7a40; --w-mid: #2f8f8a; --w-hi: #8090f0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --sky: #10161c; --ground: #19212a; --bldg: #8d98a3; --road: #2c3640; --road-major: #3c4854;
  --panel: #151c23f2; --ink: #e7ecf0; --ink-2: #a9b4be; --ink-3: #76828d; --rule: #29333d;
  --accent: #e05aa9; --accent-soft: #e05aa926; --lattice: #e05aa9;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2c9a2c; --s7: #9085e9; --s8: #e66767;
  --good: #44b874; --bad: #ef6a6a; --warn: #d9a441; --w-lo: #4e7a40; --w-mid: #2f8f8a; --w-hi: #8090f0; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 13px var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
.bar { position: fixed; z-index: 6; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 7px 12px; }
.brand b { font: 700 20px/1 var(--font-display); letter-spacing: .02em; }
.brand span { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--ink-2); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; font: 600 15px/1.05 var(--font-display); letter-spacing: .02em; }
.tabs button small { display: block; font: 400 10.5px var(--font-body); color: var(--ink-3); letter-spacing: 0; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.area { margin-left: auto; display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 5px 8px; flex-wrap: wrap; }
.area label { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 5px; align-items: center; }
#panel, #drawer { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 6px 30px #0000001c;
  overflow-y: auto; overscroll-behavior: contain; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#panel { top: 86px; left: max(10px, env(safe-area-inset-left, 0px)); width: min(360px, calc(100vw - 20px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
#drawer { top: 86px; right: max(10px, env(safe-area-inset-right, 0px)); width: min(440px, calc(100vw - 20px)); max-height: calc(100% - 96px); }
#drawer.min { width: auto; }
#drawer.min > :not(.dhead) { display: none; }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--rule); gap: 8px; }
.dhead b { font: 600 16px var(--font-display); letter-spacing: .03em; }
section.sec { padding: 10px 13px 12px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
section.sec:last-child { border-bottom: 0; }
h3 { margin: 0; font-size: 12.5px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
h3 span { font-weight: 400; color: var(--ink-3); font-size: 11px; text-align: right; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; color: var(--ink-2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.row2 label, .row3 label { display: grid; gap: 2px; font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
select, input[type="number"] { font: 12.5px var(--font-body); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 7px; padding: 5px 6px; width: 100%; min-width: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; background: var(--rule); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink-2); font: 500 12px var(--font-body); padding: 5px 4px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0002; }
.btn { border: 1px solid var(--rule); background: transparent; color: var(--ink); font: 500 12px var(--font-body); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font: 600 14px var(--font-display); letter-spacing: .04em; }
.btn[aria-pressed="true"] { border-color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 5px; }
.note { font-size: 11px; color: var(--ink-3); line-height: 1.45; margin: 0; }
.note code, .eq { font-family: var(--font-mono); font-size: 10.5px; }
.eq { background: var(--accent-soft); border-radius: 6px; padding: 6px 8px; color: var(--ink-2); line-height: 1.55; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.kpi { border-left: 2px solid var(--rule); padding-left: 7px; min-width: 0; }
.kpi .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.kpi .v { font-family: var(--font-mono); font-size: 16px; font-variant-numeric: tabular-nums; }
.kpi .r { font-size: 10px; color: var(--ink-3); }
.kpi.hot { border-left-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
td:first-child, th:first-child { text-align: left; }
td.m { font-family: var(--font-mono); }
td.ok { color: var(--good); } td.off { color: var(--warn); }
tr.sel td { background: var(--accent-soft); }
tr.click { cursor: pointer; }
.tw { overflow-x: auto; }
canvas.chart { width: 100%; height: 170px; display: block; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; vertical-align: -1px; margin-right: 4px; }
.prog { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.pin { position: fixed; transform: translate(-50%, -100%); pointer-events: none; z-index: 3; text-align: center; }
.pin .b { font: 600 15px var(--font-display); background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 18px; padding: 2px 10px; white-space: nowrap; }
.pin .s { width: 2px; height: 34px; background: var(--ink); margin: 0 auto; }
.pin.g .b { background: var(--ink); color: var(--panel); }
.toast { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 7px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 80vw; }
.toast.on { opacity: 1; }
.legend { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 5px 10px; font-size: 11px; color: var(--ink-2); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 820px); }
.legend a { color: var(--ink-2); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }
@media (max-width: 1100px) { #drawer { top: auto; bottom: max(10px, env(safe-area-inset-bottom, 0px)); max-height: 42%; } .legend { display: none; } }
@media (max-width: 700px) { #panel { top: auto; height: 46%; } #drawer { display: none; } .area { margin-left: 0; } }
</style>

<div id="stage"></div>
<div class="pin" id="pinA"><div class="b">Start ○</div><div class="s"></div></div>
<div class="pin g" id="pinB"><div class="b">Goal ⚑</div><div class="s"></div></div>

<div class="bar">
  <div class="brand"><b>AAM Corridor Lab</b><span id="areaname"></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" type="button" data-t="p1" aria-selected="true">1 · Wind-aware routing<small>TRR · Exps 6.2–6.5</small></button>
    <button role="tab" type="button" data-t="p2" aria-selected="false">2 · Airspace configuration<small>TRB · SIRE · Exps 1–4</small></button>
    <button role="tab" type="button" data-t="p3" aria-selected="false">3 · Rolling horizon<small>Priority ILP · FCFS · offline</small></button>
  </nav>
  <div class="area">
    <label>Buildings <span class="seg" style="min-width:150px"><button type="button" id="bld-on" aria-pressed="true">City</button><button type="button" id="bld-off" aria-pressed="false">Open field</button></span></label>
    <button class="btn" type="button" id="place">Place Start/Goal</button>
    <label class="btn" for="osmfile" style="cursor:pointer">Load .osm area<input type="file" id="osmfile" accept=".osm,.xml" hidden></label>
  </div>
</div>

<aside id="panel" aria-label="Experiment controls"></aside>
<aside id="drawer" aria-label="Experiment results"><div class="dhead"><b id="dtitle">Results</b><button class="btn" type="button" id="dmin">Hide</button></div><div id="dbody"></div></aside>
<div class="legend" id="legend"></div>
<div class="toast" id="toast"></div>

<script>/*__ENGINE__*/</script>
<script>const DATA=/*__DATA__*/null; const ENGINE_SRC=/*__ENGINE_SRC__*/"";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const G = window.LabEngine, FT = G.FT;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SER = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const mean = (a) => { const f = a.filter((x) => isFinite(x)); return f.length ? f.reduce((p, q) => p + q, 0) / f.length : NaN; };
const fmt = (x, d = 1) => (x == null || !isFinite(x)) ? "–" : Number(x).toFixed(d);
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3200); };
if (!window.THREE || !DATA) { document.body.insertAdjacentHTML("beforeend", '<div class="fallback">The lab needs three.js from cdnjs and jsDelivr. Check the connection and reload.</div>'); return; }

// ===================================================================== state
const PRESETS = {
  trr:  { name: "TRR paper: 6,000 ft blocks", mlen: 6000, mwid: 100, nlat: 2, z: [0, 200, 300, 400], vert: false, len: 30000, depth: 1 },
  trb:  { name: "TRB paper: 1,000 × 200 × 100 ft", mlen: 1000, mwid: 200, nlat: 2, z: [0, 100, 200, 300, 400], vert: false, len: 30000, depth: 1 },
  city: { name: "City: 500 × 160 × 100 ft", mlen: 500, mwid: 160, nlat: 6, z: [0, 100, 200, 300, 400], vert: true, len: null, depth: 2 },
};
const S = {
  tab: "p1", city: { name: DATA.city.name, origin: DATA.city.origin, buildings: DATA.city.buildings, roads: DATA.city.roads },
  buildingsOn: true, start: DATA.city.start_en.slice(), goal: DATA.city.goal_en.slice(),
  design: Object.assign({}, PRESETS.city, { preset: "city", usePaperLength: false, clearance: 25 }),
  veh: { cruise_mph: 35, energy_j_per_ft: 20.42, phase_dependent: false, k_climb: 0.2, alpha_desc: 1, takeoff_fraction: 0.1 },
  C: null, wind: null, urban: null, weather: DATA.weather, p1: { exp: "urban", dir: 0, trend: "calm_to_strong", dep: 0, oLane: 0, dLane: 0, sel: 0, bg: { speed: 4, dir: 0 } },
  p2: { D: 600, ops: 3, share: 1, rule: "undirected", win: 60, pattern: "uniform", tie: "operator", slot: 60, windLinks: false },
  p3: { case: 0, method: 1 }, anim: { t: 0, playing: false, rate: 1, tmax: 1 },
};

// ===================================================================== 3D scene (east-north metres -> three: x, z_up, -y)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); $("stage").appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, 1, 5, 60000);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ab, 0.78)); const sun = new THREE.DirectionalLight(0xffffff, 0.72); sun.position.set(-800, 1500, 600); scene.add(sun);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; const off = w > 1100 ? -40 : 0; if (off) camera.setViewOffset(w, h, off, 0, w, h); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const V = (e, n, z) => new THREE.Vector3(e, z, -n);
const col = (n) => new THREE.Color(css(n));
const groups = {};
function group(name) { const old = groups[name]; if (old) { scene.remove(old); old.traverse((o) => { o.geometry && o.geometry.dispose(); if (o.material) [].concat(o.material).forEach((m) => m.dispose()); }); } const g = new THREE.Group(); groups[name] = g; scene.add(g); return g; }
// corridor frame -> EN
let F = null;
const cEN = (x, y) => G.toEN(F, x, y);
const nodeV = (n, lift = 0) => { const p = S.C.pos[n], e = cEN(p[0], p[1]); return V(e[0], e[1], Math.max(p[2], 1.5) + lift); };

function drawCity() {
  scene.background = col("--sky");
  const g = group("city");
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshLambertMaterial({ color: col("--ground") }));
  plate.rotation.x = -Math.PI / 2; plate.position.y = -0.6; g.add(plate);
  if (!S.buildingsOn) return;
  const mn = [], mj = [];
  for (const r of S.city.roads) { const a = r.M ? mj : mn, p = r.p; for (let k = 0; k + 3 < p.length; k += 2) a.push(p[k], 0.2, -p[k + 1], p[k + 2], 0.2, -p[k + 3]); }
  for (const [a, c] of [[mn, "--road"], [mj, "--road-major"]]) { const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(a, 3)); g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: col(c) }))); }
  const geos = [];
  for (const b of S.city.buildings) {
    const p = b.p, sh = new THREE.Shape(); sh.moveTo(p[0], p[1]); for (let k = 2; k < p.length; k += 2) sh.lineTo(p[k], p[k + 1]);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: Math.max(1, b.h), bevelEnabled: false }); geo.rotateX(-Math.PI / 2); geo.deleteAttribute("uv"); geos.push(geo.index ? geo.toNonIndexed() : geo);
  }
  if (geos.length) { const m = THREE.BufferGeometryUtils.mergeBufferGeometries(geos, false); geos.forEach((x) => x.dispose());
    g.add(new THREE.Mesh(m, new THREE.MeshLambertMaterial({ color: col("--bldg") })));
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(m, 30), new THREE.LineBasicMaterial({ color: col("--road-major"), transparent: true, opacity: 0.35 }))); }
}
function drawLattice() {
  const g = group("lattice"), C = S.C, v = [];
  for (const [a, b] of C.edges) { const p = nodeV(a, 0), q = nodeV(b, 0); v.push(p.x, p.y, p.z, q.x, q.y, q.z); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: col("--lattice"), transparent: true, opacity: C.pos.length > 600 ? 0.1 : 0.2 })));
  for (const n of [...C.origins, ...C.destinations]) { const m = new THREE.Mesh(new THREE.CylinderGeometry(Math.max(6, C.W * 0.18), Math.max(6, C.W * 0.18), 1, 20), new THREE.MeshBasicMaterial({ color: col("--lattice"), transparent: true, opacity: 0.45 })); m.position.copy(nodeV(n, -1)); m.position.y = 0.5; g.add(m); }
}
function frameCamera() {
  const C = S.C, a = cEN(0, 0), b = cEN(C.L, 0), mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], L = C.L;
  const back = cEN(-0.25 * L, -0.55 * L);
  controls.target.copy(V(mid[0], mid[1], 20)); camera.position.copy(V(back[0], back[1], 0.55 * L + 250));
}
// ---------- drones
function makeDrone(c, s) {
  const g = new THREE.Group(), m = () => new THREE.MeshLambertMaterial({ color: col(c) });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), m()); body.scale.set(1.5 * s, 0.55 * s, 1.1 * s); g.add(body);
  for (const a of [Math.PI / 4, 3 * Math.PI / 4]) { const arm = new THREE.Mesh(new THREE.BoxGeometry(5.2 * s, 0.25 * s, 0.35 * s), m()); arm.rotation.y = a; g.add(arm); }
  g.rotors = [];
  for (const [x, z] of [[1.85, 1.85], [-1.85, 1.85], [1.85, -1.85], [-1.85, -1.85]]) { const r = new THREE.Group(); r.position.set(x * s, 0.6 * s, z * s);
    r.add(new THREE.Mesh(new THREE.CylinderGeometry(1.3 * s, 1.3 * s, 0.05 * s, 24), new THREE.MeshBasicMaterial({ color: col(c), transparent: true, opacity: 0.28 })));
    r.add(new THREE.Mesh(new THREE.BoxGeometry(2.5 * s, 0.06 * s, 0.22 * s), m())); g.add(r); g.rotors.push(r); }
  return g;
}
function droneGeo(s) { const parts = []; const body = new THREE.SphereGeometry(1, 12, 8); body.scale(1.5, 0.55, 1.1); parts.push(body);
  for (const a of [Math.PI / 4, 3 * Math.PI / 4]) { const arm = new THREE.BoxGeometry(5.2, 0.25, 0.35); arm.rotateY(a); parts.push(arm); }
  for (const [x, z] of [[1.85, 1.85], [-1.85, 1.85], [1.85, -1.85], [-1.85, -1.85]]) { const r = new THREE.CylinderGeometry(1.25, 1.25, 0.1, 16); r.translate(x, 0.6, z); parts.push(r); }
  const n = parts.map((p) => { const q = p.index ? p.toNonIndexed() : p; q.deleteAttribute("uv"); return q; }); const m = THREE.BufferGeometryUtils.mergeBufferGeometries(n, false); m.scale(s, s, s); return m; }
const droneScale = () => Math.max(4, Math.min(16, S.C.L / 260));

// ---------- wind display: node arrows (paper fields) or particles (grid fields)
function drawWindArrows(wind, bin = 0) {

    $("p3-kpis").innerHTML = `<div class="tw"><table><thead><tr><th>Method</th><th>Served</th><th>Weighted</th><th>Emerg.</th><th>Mean delay</th><th>Max delay</th><th>Re-plans</th><th>Max solve</th></tr></thead><tbody>${this.M.map((m, i) => { const k = K.methods[m].kpis; return `<tr class="click${i === S.p3.method ? " sel" : ""}" data-m="${i}"><td>${this.ML[m]}</td><td class="m">${k.served}/${K.requests.length}</td><td class="m">${fmt(100 * k.weighted_service_rate, 1)}%</td><td class="m">${fmt(100 * k.emergency_service_rate, 0)}%</td><td class="m">${fmt(k.mean_delay, 3)}</td><td class="m">${fmt(k.max_delay, 2)}</td><td class="m">${k.replans}</td><td class="m">${fmt(k.max_wall_sec, 2)} s</td></tr>`; }).join("")}</tbody></table></div>`;
    document.querySelectorAll("#p3-kpis tr.click").forEach((tr) => tr.onclick = () => { S.p3.method = +tr.dataset.m; renderPanel(); this.load(); });
    drawer("Paper 3 · request board", `<section class="sec"><h3>Requests over time <span>${this.ML[this.M[S.p3.method]]}</span></h3><canvas class="chart" id="c-board" style="height:300px"></canvas>
      <p class="note">One row per request, sorted by preferred departure. Pale bar: allowed departure window (preferred → latest). Solid bar: committed flight, coloured by priority. Shaded band: freeze window (dark) and look-ahead (light) of the current roll.</p></section>
      <section class="sec"><h3>Configuration</h3><div class="eq">Δt = ${c.dt_min} min · roll R = ${c.roll_min} · freeze F = ${c.freeze_min} · look-ahead H = ${c.horizon_min} min · K = ${c.k_paths} paths · resource rule ${c.resource_mode}<br>requests ${c.n_requests} (${c.pattern}) · max hold ${c.max_hold_min} min · reveal lead ${c.lead_min} min${c.wind_speed_mph ? ` · wind ${c.wind_speed_mph} mph toward ${c.wind_direction_deg}°` : ""}</div>
      <p class="note">Every schedule passed the independent geometry audit (no shared link-time token). Computed by the Python engine: <code>python export_rh_cases.py</code>; add cases there and rebuild with <code>python make_lab.py</code>.</p></section>`);
  },
  frame(dt) {
    const K = this.K, c = K.config, s = S.anim.t / 60 / c.dt_min, method = S.p3.method;
    for (const { d, p } of this.drones) { const committed = method === 2 || p.commit <= s, T = p.times; if (!committed || s < T[0] || s > T[T.length - 1]) { d.visible = false; continue; }
      let i = 0; while (i < T.length - 2 && T[i + 1] < s) i++; const f = (s - T[i]) / ((T[i + 1] - T[i]) || 1), a = this.V(p.path[i], 3), b = this.V(p.path[i + 1], 3);
      d.visible = true; d.position.copy(a.clone().lerp(b, f)); const dd = b.clone().sub(a); if (dd.x || dd.z) d.rotation.y = Math.atan2(-dd.z, dd.x); if (!REDUCED) d.rotors.forEach((r, k) => r.rotation.y += (k % 2 ? 1 : -1) * dt * 40); }
    const cv = $("c-board"); if (!cv) return; const Rq = K.requests.slice().sort((a, b) => a.pref - b.pref || a.rid - b.rid), tm = S.anim.tmax / 60, byR = {}; this.P3m().plans.forEach((p) => byR[p.rid] = p);
    const ch = chart(cv, [{ color: "--rule", width: 0, pts: [[0, 0], [tm, Rq.length]] }], { xlab: "Time (min)", ylab: "requests", xmin: 0, xmax: tm, ymin: 0, ymax: Rq.length, vline: S.anim.t / 60 }); if (!ch) return;
    const ctx = cv.getContext("2d"), now = S.anim.t / 60, rh = Math.max(1, ch.Y(0) - ch.Y(1) - 0.6);
    if (method !== 2) { const roll = Math.floor(now / c.roll_min) * c.roll_min; ctx.fillStyle = css("--accent"); ctx.globalAlpha = 0.08; ctx.fillRect(ch.X(roll), ch.Y(Rq.length), ch.X(roll + c.horizon_min) - ch.X(roll), ch.Y(0) - ch.Y(Rq.length)); ctx.globalAlpha = 0.18; ctx.fillRect(ch.X(roll), ch.Y(Rq.length), ch.X(roll + c.freeze_min) - ch.X(roll), ch.Y(0) - ch.Y(Rq.length)); ctx.globalAlpha = 1; }
    Rq.forEach((r, i) => { const y = ch.Y(i + 1); ctx.globalAlpha = r.reveal * c.dt_min > now ? 0.15 : 0.45; ctx.fillStyle = css("--ink-3"); ctx.fillRect(ch.X(r.pref * c.dt_min), y, Math.max(1, ch.X(r.latest * c.dt_min) - ch.X(r.pref * c.dt_min)), rh); ctx.globalAlpha = 1;
      const p = byR[r.rid]; if (p && (method === 2 || p.commit * c.dt_min <= now)) { ctx.fillStyle = css(this.PC[r.prio]); ctx.fillRect(ch.X(p.times[0] * c.dt_min), y, Math.max(2, ch.X(p.times[p.times.length - 1] * c.dt_min) - ch.X(p.times[0] * c.dt_min)), rh); } });
  },
};
function panelP3() {
  const cases = DATA.rh.cases.map((k, i) => `<option value="${i}"${S.p3.case === i ? " selected" : ""}>${k.label}</option>`).join("");
  return `<section class="sec"><h3>Priority rolling-horizon scheduling <span>Paper 3 · notebook 14 Oct 2026</span></h3>
    <p class="note">Requests are revealed ahead of time. Each roll re-solves a two-stage ILP (max priority-weighted service, then min ground delay + flight time) over the look-ahead and freezes departures inside the commitment window; committed missions keep their full reservation.</p></section>
  <section class="sec"><h3>Case</h3><div class="row">Case <select id="p3-case">${cases}</select></div>
    <div class="row">Method <div class="seg">${P3.M.map((m, i) => `<button type="button" data-m="${i}" aria-pressed="${S.p3.method === i}">${P3.ML[m].replace(" benchmark", "")}</button>`).join("")}</div></div>
    <div class="btns"><button class="btn primary" type="button" id="p3-play">Replay</button></div><div id="p3-kpis"></div>
    <p class="note">The ILP runs in Python (SciPy/HiGHS) because a browser MILP solver is not available here; this tab replays those exact schedules on the notebook corridor (4 × 1 × 3 modules of 500 × 200 × 100 ft), placed at your Start.</p></section>`;
}
function wireP3() {
  $("p3-case").onchange = (e) => { S.p3.case = +e.target.value; P3.load(); };
  document.querySelectorAll("#panel [data-m]").forEach((b) => b.onclick = () => { S.p3.method = +b.dataset.m; renderPanel(); P3.load(); });
  $("p3-play").onclick = () => { S.anim.t = 0; S.anim.playing = true; };
}

// ===================================================================== tabs, area, loop
function renderPanel() {
  const t = S.tab; $("panel").innerHTML = t === "p1" ? panelP1() : t === "p2" ? panelP2() : panelP3();
  if (t === "p1") wireP1(); else if (t === "p2") wireP2(); else wireP3();
}
function go(tab) {
  S.tab = tab; document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.t === tab));
  group("routes"); group("closed");
  if (!S.buildingsOn && tab === "p1" && S.design.preset === "trb") Object.assign(S.design, PRESETS.trr, { preset: "trr", usePaperLength: true });
  if (!S.buildingsOn && tab === "p2" && S.design.preset === "trr") Object.assign(S.design, PRESETS.trb, { preset: "trb", usePaperLength: true });
  renderPanel();
  if (tab === "p3") { P3.load(); return; }
  rebuild(); frameCamera(); if (tab === "p1") P1.run(); else P2.run();
}
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => go(b.dataset.t));
$("dmin").onclick = () => { const d = $("drawer"); d.classList.toggle("min"); $("dmin").textContent = d.classList.contains("min") ? "Show" : "Hide"; };
const setBld = (on) => { S.buildingsOn = on; $("bld-on").setAttribute("aria-pressed", on); $("bld-off").setAttribute("aria-pressed", !on);
  const key = on ? "city" : S.tab === "p2" ? "trb" : "trr"; Object.assign(S.design, PRESETS[key], { preset: key, usePaperLength: !on });
  if (!on && S.p1.exp === "urban") S.p1.exp = "shear";
  drawCity(); go(S.tab); toast(on ? "City mode: city-scale modules between real buildings." : "Open field: the paper's own geometry, for validation against the published values."); };
$("bld-on").onclick = () => setBld(true); $("bld-off").onclick = () => setBld(false);
// place start/goal by clicking the ground
let placing = 0; const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
$("place").onclick = () => { placing = 1; toast("Click the map to place Start, then Goal."); };
renderer.domElement.addEventListener("click", (e) => {
  if (!placing) return; mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const p = new THREE.Vector3(); if (!ray.ray.intersectPlane(groundPlane, p)) return; const en = [p.x, -p.z];
  if (placing === 1) { S.start = en; placing = 2; toast("Now click the Goal."); } else { S.goal = en; placing = 0; S.design.usePaperLength = false; renderPanel(); go(S.tab); toast("Corridor re-laid between your Start and Goal."); }
});
// OSM import
$("osmfile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return; toast(`Reading ${f.name}…`);
  try { const city = G.parseOSM(await f.text()); if (!city.buildings.length) throw new Error("no buildings in this file");
    let mx = [Infinity, Infinity, -Infinity, -Infinity]; city.buildings.forEach((b) => { for (let k = 0; k < b.p.length; k += 2) { mx[0] = Math.min(mx[0], b.p[k]); mx[1] = Math.min(mx[1], b.p[k + 1]); mx[2] = Math.max(mx[2], b.p[k]); mx[3] = Math.max(mx[3], b.p[k + 1]); } });
    S.city = { name: f.name.replace(/\.(osm|xml)$/i, ""), origin: city.origin, buildings: city.buildings, roads: city.roads };
    S.start = [mx[0] + (mx[2] - mx[0]) * 0.15, mx[1] + (mx[3] - mx[1]) * 0.2]; S.goal = [mx[0] + (mx[2] - mx[0]) * 0.85, mx[1] + (mx[3] - mx[1]) * 0.8];
    Object.assign(S.design, PRESETS.city, { preset: "city", usePaperLength: false }); S.buildingsOn = true; drawCity(); go(S.tab === "p3" ? "p1" : S.tab);
    toast(`${city.buildings.length} buildings loaded. Use Place Start/Goal to set the corridor.`);
  } catch (err) { toast(`Could not read that file: ${err.message}`); }
};
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; controls.update();
  if (S.anim.playing) { S.anim.t += dt * S.anim.rate; if (S.anim.t >= S.anim.tmax) { S.anim.t = S.anim.tmax; S.anim.playing = false; } }
  if (S.tab === "p1") P1.frame(dt); else if (S.tab === "p2") P2.frame(); else if (P3.K) P3.frame(dt);
  stepParticles(REDUCED ? 0 : dt); renderer.render(scene, camera); projectPins(); requestAnimationFrame(loop);
}
const retheme = () => { drawCity(); go(S.tab); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
requestAnimationFrame(loop);
drawCity(); initParticles();
try { go("p1"); } catch (err) { console.error(err); toast("Could not route on this corridor: " + err.message); }
})();
</script>
